[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "unify"
version = "0.0.0"
description = "The brain of an AI assistant — steerable async tool loops, CodeAct, and distributed manager orchestration"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.8.0",
    "openai>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-core>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pygments>=2.19.2",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "unillm",
    "numpy>=2.3.4",
    # Document parsing
    "tiktoken>=0.11.0",
    "docling>=2.82.0",
    "spacy>=3.8.7",
    "en-core-web-sm",
    "pymupdf>=1.27.1",
    "openpyxl>=3.1.5",
    "pillow>=11.3.0",
    "polars>=1.39.3",
    "jsonschema>=4.20",
    # Local embeddings (UNIFY_LOCAL_EMBEDDINGS)
    "torch>=2.13.0",
    "transformers>=5.17.0",
    "huggingface-hub>=1.16.1",
]

[dependency-groups]
# Formatters are the single source of truth for the pinned versions CI and
# pre-commit both run. Keep them here (locked in uv.lock), not duplicated in the
# pre-commit hook.
lint = [
    "black==26.5.1",
    "autoflake>=2.3.1",
    "ruff>=0.15.19",
]
dev = [
    "pytest>=8.4.2",
    "pytest-asyncio>=0.24.0",
    "pytest-xdist>=3.6.1",
    "pytest-html>=4.1.1",
    "hypothesis>=6.135.29",
    "viztracer>=1.0.4",
    "pytest-dotenv>=0.5.2",
    "ipykernel>=7.1.0",
    "rich>=13.9.4",
    "pre-commit>=4.0.1",
    "pyflakes>=3.2.0",
    {include-group = "lint"},
]

[tool.setuptools.packages.find]
include = ["unify", "unify.*"]

[project.scripts]
unify = "unify.__main__:main"

[tool.uv.sources]
unillm = { path = "../unillm", editable = true }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.black]
target-version = ["py312"]
