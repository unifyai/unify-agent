[pytest]
pythonpath = .
testpaths = tests
addopts = --capture=tee-sys --log-cli-level=INFO --import-mode=importlib
asyncio_default_test_loop_scope = function
generate_report_on_test = True
console_output_style = progress-even-when-capture-no
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration (deselect with '-m "not integration"')
    unit: marks tests as unit (deselect with '-m "not unit"')
    vision: marks tests as vision (deselect with '-m "not vision"')
    llm_call: marks tests that reach a model, cached or live. A cost marker, not a semantics one: an llm_call test may still assert something exact (which tool ran). Orthogonal to eval, which marks tests whose subject IS the model's behaviour. A test carrying neither is what CI calls deterministic (deselect with '-m "not llm_call"')
    timeout(seconds): each phase of the test (setup, call, teardown) fails after this many seconds, and the process is killed UNIFY_TEST_TIMEOUT_GRACE (60) seconds later (tests/_test_timeouts.py). Unmarked tests get UNIFY_TEST_TIMEOUT (900)
filterwarnings =
    ignore:Using `@model_validator` with mode='after' on a classmethod is deprecated:DeprecationWarning:docling_core
    ignore:Importing 'parser.split_arg_string' is deprecated:DeprecationWarning:click
    ignore:Importing 'parser.split_arg_string' is deprecated:DeprecationWarning:spacy
    ignore:Importing 'parser.split_arg_string' is deprecated:DeprecationWarning:weasel
