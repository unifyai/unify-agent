[pytest]
pythonpath = .
testpaths = tests
addopts = --capture=tee-sys --log-cli-level=INFO --import-mode=importlib -rfEs
asyncio_default_test_loop_scope = function
generate_report_on_test = True
console_output_style = progress-even-when-capture-no
markers =
    timeout(seconds): each phase of the test (setup, call, teardown) fails after this many seconds, and the process is killed UNIFY_TEST_TIMEOUT_GRACE (60) seconds later (tests/_test_timeouts.py). Unmarked tests get UNIFY_TEST_TIMEOUT (900)
    requires_provider_key: not allowed. No test may need a provider key; a test carrying this marker fails (tests/conftest.py). Script the model instead (tests/scripted_model.py)
    live_provider: not allowed. No test may reach a model provider; a test carrying this marker fails (tests/conftest.py). Script the model instead (tests/scripted_model.py)
filterwarnings =
    ignore:Importing 'parser.split_arg_string' is deprecated:DeprecationWarning:click
